name: CI - Lint, Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type-Check & Lint
        run: npm run lint

      - name: Run Core & Module Tests
        run: |
          npm run test:modules
          npm run test:phase52:unit

      - name: Production Build for Cloudflare Pages
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/sw.js || exit 1
          test -f dist/manifest.webmanifest || exit 1
          test -f dist/_headers || exit 1
          test -f dist/_redirects || exit 1
          echo "All Cloudflare Pages build artifacts verified."
