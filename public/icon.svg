<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Subtle Grid Pattern in safe zone -->
  <g opacity="0.08">
    <line x1="96" y1="96" x2="416" y2="96" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="96" y1="192" x2="416" y2="192" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="96" y1="288" x2="416" y2="288" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="96" y1="384" x2="416" y2="384" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />
  </g>

  <!-- Code Brackets & Slash Logo (within 80% safe zone) -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- Left Bracket < -->
    <path d="M 184 176 L 108 256 L 184 336" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Bracket > -->
    <path d="M 328 176 L 404 256 L 328 336" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Slash / -->
    <line x1="280" y1="152" x2="232" y2="360" stroke="#38bdf8" stroke-width="32" stroke-linecap="round" />

    <!-- Studio Sparkle Dot -->
    <circle cx="360" cy="156" r="14" fill="#38bdf8" />
    <circle cx="152" cy="356" r="10" fill="#a855f7" />
  </g>
</svg>
